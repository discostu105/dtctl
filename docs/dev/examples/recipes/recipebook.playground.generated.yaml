# RECIPE BOOK — hand-assembled TRANSCRIPT of the manual §10.1 pack-
# verification run against the "playground-tenant-e" tenant on 2026-07-17.
# No generator exists yet; this file shows the referencing form
# `dtctl recipes discover` would emit (pack pointer + stamp; DQL lives in
# the pack). Names anonymized; entity counts ROUNDED (privacy rule, concept
# §3); facts contain only what that run measured.

# Stamps (`lastRun:`) are a living cache refreshed on every run. All runs
# used recipe defaults, so per-stamp `params: default` is omitted here. The
# pack pin is `source:` — retained pack versions are immutable.
apiVersion: dtctl.dev/v1alpha1
kind: RecipeBook
metadata:
  name: playground-tenant-e
  generatedAt: 2026-07-17
  packs:
    - { name: dynatrace-recipes, version: "2026.07" }
  probes: 44 recipes executed, plus classification probes

facts:
  character: mixed playground tenant (K8s + OTel + Juniper network + synthetic
    + RUM + GenAI, all active; ~3.1M logs/h, ~1.8M spans/h, ~6.1M RUM
    events/day, ~2.1M bizevents/day)
  entityTypes: { PROCESS: 790, CONTAINER: 620, EXT_NETWORK_INTERFACE: 620, K8S_POD: 470,
                 OTEL_PROCESS: 450, JUNIPER_RUNNING_APP: 360, HOST: 17 }
  # capabilities/absent are evaluated from the pack's capability definitions
  # (each name is defined by how it is discovered — see base-pack.full).
  capabilities: [hosts, k8s, k8s-node-labels, k8s-metrics, host-metrics, process-metrics, spans,
                 spans-oneagent, logs, logs-oneagent, service-metrics, davis, davis-events,
                 rum, rum-web, bizevents, genai, security, security-rap, security-detections,
                 kspm, synthetic, aws, aws-cloudwatch, postgres]
