# RECIPE BOOK — hand-assembled TRANSCRIPT of the manual §10.1 pack-
# verification run against the "netobs-tenant-c" tenant on 2026-07-17. No
# generator exists yet; this file shows the referencing form
# `dtctl recipes discover` would emit (pack pointer + stamp; DQL lives in
# the pack). Names anonymized; entity counts ROUNDED (privacy rule, concept
# §3); facts contain only what that run measured.

# Stamps (`lastRun:`) are a living cache refreshed on every run. All runs
# used recipe defaults, so per-stamp `params: default` is omitted here. The
# pack pin is `source:` — retained pack versions are immutable.
apiVersion: dtctl.dev/v1alpha1
kind: RecipeBook
metadata:
  name: netobs-tenant-c
  generatedAt: 2026-07-17
  packs:
    - { name: dynatrace-recipes, version: "2026.07" }
  probes: 44 recipes executed, plus classification probes

facts:
  character: network-observability dev-lab tenant (Juniper + external network
    devices + synthetic locations; ~1.3M logs/h, ~1.7M spans/h, ~6.3M RUM
    events/day)
  entityTypes: { EXT_NETWORK_INTERFACE: 6300, K8S_REPLICASET: 510, JUNIPER_RUNNING_APP: 500,
                 EXT_NETWORK_DEVICE: 360, SYNTHETIC_LOCATION: 220, K8S_POD: 160, HOST: 12 }
  # capabilities/absent are evaluated from the pack's capability definitions
  # (each name is defined by how it is discovered — see base-pack.full);
  # qualifiers that used to live in ad-hoc names ("genai-sparse",
  # "rap-detections-in-2h", "classic-synthetic-entity-tables") are notes.
  capabilities: [hosts, k8s, k8s-metrics, host-metrics, process-metrics, spans, spans-oneagent,
                 logs, logs-oneagent, service-metrics, davis, davis-events, rum, rum-web,
                 bizevents, genai, security, security-detections, kspm, synthetic,
                 aws, aws-cloudwatch, gcp, postgres, dps]
  absent: [k8s-node-labels, security-rap]
  notes:
    - "GenAI traffic is sparse (azure.ai.openai) — usage tokens + provider carried but NO gen_ai.request.model; genai-spans-recent widened to 24h"
    - "dt.synthetic.events exists (300 failed executions/2h) while the classic entity tables dt.entity.synthetic_test/http_check do NOT — the dataObjects guard catches this"
    - "6 security detections tenant-wide in 24h, none from Runtime Application Protection (security-rap absent)"

