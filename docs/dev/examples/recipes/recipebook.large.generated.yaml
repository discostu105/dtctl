# RECIPE BOOK — hand-assembled TRANSCRIPT of the manual §10.1 pack-
# verification run against the "bigcorp-tenant-d" tenant on 2026-07-17. No
# generator exists yet; this file shows the referencing form
# `dtctl recipes discover` would emit (pack pointer + stamp; DQL lives in
# the pack). Names anonymized; entity counts ROUNDED (privacy rule, concept
# §3); facts contain only what that run measured.

# Stamps (`lastRun:`) are a living cache refreshed on every run. All runs
# used recipe defaults, so per-stamp `params: default` is omitted here. The
# pack pin is `source:` — retained pack versions are immutable.
apiVersion: dtctl.dev/v1alpha1
kind: RecipeBook
metadata:
  name: bigcorp-tenant-d
  generatedAt: 2026-07-17
  packs:
    - { name: dynatrace-recipes, version: "2026.07" }
  probes: 44 recipes executed, plus classification probes

facts:
  character: very large enterprise-scale tenant (Azure + AWS + K8s; 66M spans/hour)
  entityTypes: { OS_SERVICE: 280000, PROCESS: 96000, CONTAINER: 59000,
                 AZURE_MICROSOFT_DBFORPOSTGRESQL_FLEXIBLESERVERS_CONFIGURATIONS: 56000,
                 K8S_POD: 35000, K8S_SECRET: 19000 }
  # capabilities/absent are evaluated from the pack's capability definitions
  # (each name is defined by how it is discovered — see base-pack.full);
  # scale caveats that used to live in an ad-hoc `scale-warnings:` key and
  # entity-flavor qualifiers ("DB_INSTANCE_POSTGRES-entities") are notes.
  capabilities: [hosts, k8s, k8s-metrics, host-metrics, process-metrics, spans, spans-oneagent,
                 logs, logs-oneagent, service-metrics, davis, davis-events, rum, rum-web,
                 bizevents, genai, security, security-detections, kspm, synthetic,
                 aws, aws-cloudwatch, azure, postgres, dps]
  absent: [security-rap, k8s-node-labels]   # k8s-node-labels: the labels probe
                 # hard-errors here (INNER_FIELD_OF_FIELD_DOES_NOT_EXIST) — same
                 # evidence that disabled nodes-inventory below
  notes:
    - "unsampled 1h log scans hit the 500 GB scan limit — every log/bizevent recipe on this tenant needs samplingRatio or bucket filters"
    - "metrics-catalog costs 34s (vs 2.4s on a small tenant) — cost stamps below are load-bearing here"
    - "Postgres exists only as AZURE_MICROSOFT_DBFORPOSTGRESQL_* entities (56k), not DB_INSTANCE_POSTGRES — the revised union body of postgres-instances covers this (re-verify)"
    - "15 security detections in 24h, none from Runtime Application Protection (security-rap absent)"

