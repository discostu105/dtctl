# RECIPE BOOK — hand-assembled TRANSCRIPT of the manual §10.1 pack-
# verification run against the "demo-tenant-b" tenant on 2026-07-17. No
# generator exists yet; this file shows the referencing form
# `dtctl recipes discover` would emit: recipes carry a pack pointer + stamp
# instead of duplicating DQL, and `query --recipe` resolves the DQL from the
# pack unless the book carries an override. Names anonymized; facts contain
# only what that run measured.

# Stamps (`lastRun:`) are a living cache refreshed on every run. All runs
# used recipe defaults, so per-stamp `params: default` is omitted here. The
# pack pin is `source:` — retained pack versions are immutable.
apiVersion: dtctl.dev/v1alpha1
kind: RecipeBook
metadata:
  name: demo-tenant-b
  generatedAt: 2026-07-17
  packs:
    - { name: dynatrace-recipes, version: "2026.07" }
  probes: 44 recipes executed, plus 7 classification probes

facts:
  character: fully-loaded demo tenant (K8s + AWS + GCP + network + RUM + GenAI)
  entityTypes: { K8S_JOB: 1969, PROCESS: 1564, CONTAINER: 1145, K8S_POD: 566, SERVICE: 144, HOST: 49 }
  # capabilities/absent are evaluated from the pack's capability definitions
  # (each name is defined by how it is discovered — see base-pack.full);
  # qualifiers that used to live in ad-hoc names ("mixed-era-spans") are notes.
  capabilities: [hosts, k8s, k8s-node-labels, k8s-metrics, host-metrics, process-metrics,
                 spans, spans-oneagent, logs, logs-oneagent, service-metrics, davis,
                 davis-events, rum, rum-web, bizevents, genai, security, security-rap,
                 security-detections, kspm, synthetic, aws, aws-cloudwatch, gcp, postgres, dps]
                 # gcp: GCP_* entities in the census (§10 headline); k8s-node-labels:
                 # nodes-inventory ran WITH label columns cleanly on this tenant
  absent: []
  fieldCarriage:
    spans: { http.request.method: 0.42, http.method: 0.06, dt.smartscape.service: 1.0 }
    logs: { k8s.pod.name: 0.0014, dt.smartscape.service: 0.20, dt.smartscape.k8s_pod: 0.0 }
  notes:
    - "mixed-era spans (13% OneAgent / 87% OTel http fields) — see fieldCarriage; filters use typed OR"
    - "top-error-messages costs ~12s (24h content grouping) — agents should prefer log-error-rate-over-time for trend questions"

