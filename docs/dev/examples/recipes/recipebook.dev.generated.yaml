# RECIPE BOOK — hand-assembled TRANSCRIPT of the manual §10.1 pack-
# verification run against the "dev-tenant-a" tenant on 2026-07-17. No
# generator exists yet; this file shows the referencing form
# `dtctl recipes discover` would emit: recipes carry a pack pointer + stamp
# instead of duplicating DQL, and `query --recipe` resolves the DQL from the
# pack unless the book carries an override. Names anonymized; facts contain
# only what that run measured.

# Stamps (`lastRun:`) are a living cache refreshed on every run. All runs
# used recipe defaults, so per-stamp `params: default` is omitted here. The
# pack pin is `source:` — retained pack versions are immutable.
apiVersion: dtctl.dev/v1alpha1
kind: RecipeBook
metadata:
  name: dev-tenant-a
  generatedAt: 2026-07-17
  packs:
    - { name: dynatrace-recipes, version: "2026.07" }
  probes: 44 recipes executed, plus 7 classification probes

facts:
  character: OTel-process-centric dev tenant
  entityTypes: { OTEL_PROCESS: 3040, K8S_POD: 288, HOST: 13, SERVICE: 12 }
  # capabilities/absent are evaluated from the pack's capability definitions
  # (each name is defined by how it is discovered — see base-pack.full);
  # qualifiers that used to live in ad-hoc names ("genai-sparse") are notes.
  capabilities: [hosts, k8s, k8s-node-labels, k8s-metrics, host-metrics, process-metrics,
                 spans, logs, logs-oneagent, service-metrics, davis, davis-events, rum,
                 rum-web, bizevents, genai, security, kspm, aws, aws-cloudwatch, postgres, dps]
                 # k8s-node-labels: nodes-inventory ran WITH label columns cleanly here
  absent: [synthetic, security-rap, security-detections, spans-oneagent]
  fieldCarriage:
    spans: { http.request.method: 0.55, http.method: 0.0, dt.smartscape.service: 1.0,
             dt.failure_detection.results: 0.00003 }
    logs: { k8s.pod.name: 0.58, dt.smartscape.service: 0.04, dt.smartscape.k8s_pod: 0.0 }
  notes:
    - "GenAI traffic is sparse — genai-spans-recent runs widened to 24h (see override)"
    - "aws-cloudwatch ingests only RDS CPUUtilization; EC2 metrics absent (idle-ec2-low-cpu disabled by probe)"

