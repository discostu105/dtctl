disabled:
  # class: guard = structural evidence, durable, re-checked by refresh.
  # class: probe-empty = absence of events in a window — WEAK evidence
  # (a quiet window is indistinguishable from a missing capability, §10.1
  # lesson 2); re-probed on every refresh, and `query --recipe` still runs
  # the recipe (with a warning) — a non-empty result resurrects it.
  attacks-recent:
    class: probe-empty
    at: 2026-07-17
    reason: "0 DETECTION_FINDING events in 24h — event absence only: cannot distinguish 'RAP not active' from a quiet window"
  detection-count-by-severity:
    class: probe-empty
    at: 2026-07-17
    reason: "probe returned 1 row with all counts 0 — no security detections in the window (caught by `expect: values` verification)"
  failure-reason-breakdown:
