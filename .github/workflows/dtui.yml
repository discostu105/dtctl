name: dtui

# No paths filter: dtui imports the root module's packages, so any change to
# pkg/ (or sdk/) can break it — build and test it on every push/PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: dtui Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download dtui dependencies
        working-directory: dtui
        run: go mod download

      - name: Verify dtui compiles
        working-directory: dtui
        shell: bash
        run: go build ./...

      - name: Run go vet
        working-directory: dtui
        shell: bash
        run: go vet ./...

      - name: Run dtui tests
        working-directory: dtui
        shell: bash
        run: go test -race ./...

  checks:
    name: dtctl Lean Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the TUI stack stays out of the root module
        run: make dtctl-check-lean
